<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROMA - Admin Login</title>
    <link rel="stylesheet" href="home.css">
    <style>
        body {
            padding-top: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5fde8;
        }

        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .login-logo img {
            width: 44px;
            height: 44px;
        }

        .login-logo span {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.04em;
        }

        .login-card h1 {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 32px;
            color: #444;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 0.92rem;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgb(124, 197, 7);
        }

        .login-btn {
            width: 100%;
            background-color: rgb(124, 197, 7);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .login-btn:hover {
            background-color: rgb(157, 199, 90);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            display: none;
            background: #fdecea;
            border: 1px solid #f5c6cb;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 7px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            text-align: center;
        }

        .login-error.visible {
            display: block;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-logo">
            <img src="asets/logo.png" alt="Aroma logo">
            <span>SWEET AROMA</span>
        </div>
        <h1>Admin Login</h1>

        <div class="login-error" id="login-error"></div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="admin@aromarestaurant.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="login-btn" id="login-btn">Sign In</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="login.js"></script>

</body>

</html>
